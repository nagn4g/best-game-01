<head>
<meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#100c20"><title>STARWAKE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100c20;color:#f7ebca;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}#frame{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));overflow:hidden;background:#100c20;box-shadow:0 0 80px #000}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:3.2%;left:3.5%;right:3.5%;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:12px;letter-spacing:2px;color:#c8aadf}.brand b{color:#f4cb70;font-weight:800}.readouts{display:flex;gap:24px;text-align:right;font-size:11px;color:#ae9dbd;text-transform:uppercase;letter-spacing:1px}.readouts strong{display:block;color:#fff1d0;font-size:16px;letter-spacing:0}.health{position:absolute;left:3.5%;top:11%;width:180px}.label{font-size:10px;letter-spacing:1.5px;color:#cfb8dc}.bar{height:5px;background:#34263c;margin-top:6px;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e38bca,#f3c76b);transition:width .12s}.bottom{position:absolute;bottom:3.5%;left:3.5%;right:3.5%;display:flex;justify-content:space-between;align-items:end;font-size:11px;color:#baa9c3}.bottom strong{color:#f6d27b}.upgrades{color:#e0c1ea}.banner{position:absolute;left:0;right:0;top:17%;text-align:center;font-weight:800;letter-spacing:5px;color:#ffe2a1;text-shadow:0 0 22px #e6a7f2;font-size:clamp(15px,2vw,24px);opacity:0;transition:opacity .25s}.banner.show{opacity:1}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(12,8,22,.63);pointer-events:auto}.overlay.show{display:flex}.panel{width:min(760px,90%);padding:32px 28px;background:rgba(22,15,38,.91);border:1px solid rgba(229,197,255,.24);box-shadow:0 18px 70px #090610;border-radius:8px}.title{font-size:clamp(44px,9vw,86px);line-height:.95;letter-spacing:5px;font-weight:900;color:#fff0cc;text-shadow:0 0 35px #b16bd1}.subtitle{margin:14px 0 26px;color:#cfb7dc;font-size:13px;letter-spacing:2px}.accent{color:#f0c96d}.button{pointer-events:auto;border:1px solid #f0c96d;color:#f8e6bc;background:#362440;padding:12px 22px;font:700 12px system-ui;letter-spacing:2px;cursor:pointer;border-radius:3px}.button:hover{background:#65415d}.hint{margin-top:16px;font-size:11px;color:#9d8ba9}.cards{display:flex;gap:12px;margin:24px 0}.card{flex:1;min-width:0;padding:18px 12px;border:1px solid #755d81;background:#21192e;cursor:pointer;color:#f4e6c7;pointer-events:auto;border-radius:5px}.card:hover{border-color:#f0c96d;transform:translateY(-2px)}.card b{display:block;color:#f2ca72;font-size:13px;letter-spacing:1px}.card span{display:block;margin-top:9px;font-size:11px;color:#c5b3cc}.stars{font-size:34px;color:#f3ce71;letter-spacing:8px;margin:10px}.stats{display:flex;justify-content:center;gap:24px;margin:18px;color:#c5b3cc;font-size:12px}.stats b{display:block;color:#fff1d0;font-size:16px}@media(max-width:580px){.readouts{gap:10px;font-size:9px}.readouts strong{font-size:13px}.health{width:130px}.cards{gap:5px}.card{padding:12px 6px}.card span{font-size:10px}.panel{padding:24px 14px}}
</style></head>
<body><main id="frame"><canvas id="game" width="1280" height="720"></canvas><div id="hud"><div class="top"><div class="brand"><b>STAR</b>WAKE <span> // WAKE-RUNNER</span></div><div class="readouts"><div>WAVE<strong id="wave">01 / 12</strong></div><div>SCORE<strong id="score">000000</strong></div><div>BEST<strong id="best">000000</strong></div></div></div><div class="health"><div class="label">HULL <span id="hptext">100</span>%</div><div class="bar"><i id="hpbar"></i></div></div><div id="banner" class="banner">WAVE 01</div><div class="bottom"><div>DASH <strong id="dash">READY</strong> <span id="upgrades" class="upgrades"></span></div><div>WASD / ARROWS MOVE · MOUSE / SPACE FIRE · SHIFT DASH · P PAUSE · M MUTE</div></div><div id="overlay" class="overlay"><section id="panel" class="panel"></section></div></div></main><script type="module" src="./src/main.js"></script></body></html>
